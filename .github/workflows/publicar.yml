name: Publicar post do dia

on:
  schedule:
    # O GitHub costuma atrasar o disparo em ~4h. Principal: 07:17 de Brasília
    # (10:17 UTC), para o post sair perto do fim da manhã.
    - cron: "17 10 * * *"
    # Reserva: 11:47 de Brasília (14:47 UTC). Se o principal já publicou, este
    # só confere e não faz nada (nunca publica duas vezes).
    - cron: "47 14 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar ou teste (teste valida token e imagens sem publicar)"
        required: true
        default: teste
        type: choice
        options: [teste, publicar]
      data:
        description: "Data no formato AAAA-MM-DD (vazio = hoje)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Pega o estado mais recente da branch (não o do momento do agendamento),
          # para enxergar publicados.json atualizado e nunca postar em duplicidade.
          ref: ${{ github.ref_name }}

      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODO: ${{ github.event.inputs.modo || 'publicar' }}
          DATA: ${{ github.event.inputs.data }}
          BRANCH: ${{ github.ref_name }}
        run: python3 publicar.py

      - name: Registrar publicação
        if: always()
        run: |
          if [ -n "$(git status --porcelain publicados.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publicados.json
            git commit -m "Registro de publicação $(TZ=America/Sao_Paulo date +%F)"
            git pull --rebase
            git push
          fi
