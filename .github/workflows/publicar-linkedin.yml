name: Publicar post do dia no LinkedIn

on:
  schedule:
    # O GitHub costuma atrasar o disparo em algumas horas. Principal: 06:07 de Brasília (09:07 UTC).
    - cron: "7 9 * * *"
    # Reserva: 09:37 de Brasília (12:37 UTC). Se o principal já publicou, só confere (nunca publica duas vezes).
    - cron: "37 12 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar ou teste (teste valida token, permissão e arquivos sem publicar)"
        required: true
        default: teste
        type: choice
        options: [teste, publicar]
      data:
        description: "Data no formato AAAA-MM-DD (vazio = hoje)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publicar-linkedin
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Publicar
        env:
          LI_TOKEN: ${{ secrets.LI_TOKEN }}
          LI_TOKEN_VENCE: ${{ vars.LI_TOKEN_VENCE }}
          MODO: ${{ github.event.inputs.modo || 'publicar' }}
          DATA: ${{ github.event.inputs.data }}
        run: python3 publicar_linkedin.py

      - name: Registrar publicação
        if: always()
        run: |
          if [ -n "$(git status --porcelain publicados-linkedin.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publicados-linkedin.json
            git commit -m "Registro de publicação no LinkedIn $(TZ=America/Sao_Paulo date +%F)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
